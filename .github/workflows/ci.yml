name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qrfinity
          POSTGRES_PASSWORD: qrfinity
          POSTGRES_DB: qrfinity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qrfinity" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: qrfinity
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ghostscript (EPS render test) and psql
        run: sudo apt-get update -q && sudo apt-get install -y -q ghostscript postgresql-client
      - name: Test databases and the redirect Worker's read-only role
        run: |
          psql -h localhost -U qrfinity -d qrfinity -c "CREATE DATABASE qrfinity_test" -c "CREATE DATABASE qrfinity_e2e"
          psql -h localhost -U qrfinity -d qrfinity -c "CREATE ROLE redirect_reader LOGIN PASSWORD 'redirect_reader'"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @qrfinity/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
